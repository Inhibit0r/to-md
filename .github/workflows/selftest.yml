name: selftest

on:
  push:
  pull_request:

# Наименьшие права: ровно одно чтение, которое нужно checkout.
# Пустой блок снимает и его — на приватном репозитории клон падает
# с «Repository not found», на публичном молча выезжает на анонимном доступе.
permissions:
  contents: read

jobs:
  selftest:
    # Плагин обещает три платформы — проверяем на всех трёх, а не на удобной.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      # Экшены прибиты к коммитам: тег можно переставить, коммит нельзя.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Нижняя граница из README: её и проверяем, а не то, что новее.
          python-version: "3.10"

      # anydoc — ветка документов гоняется живьём; requests — прямой импорт
      # загрузчика Plaud, транзитивно он не приезжает.
      # PyYAML читает правила вызова навыков в этой проверке.
      - run: pip install firecrawl-anydoc requests PyYAML

      - name: Проверить ручной вызов навыков в Codex
        shell: python
        run: |
          import json
          from pathlib import Path

          import yaml

          commands = {"$to-md:convert", "$to-md:setup"}
          for command in commands:
              skill = command.split(":")[1]
              config = Path("skills", skill, "agents", "openai.yaml")
              policy = yaml.safe_load(config.read_text(encoding="utf-8"))["policy"]
              assert policy["allow_implicit_invocation"] is False, command

          manifest = json.loads(Path(".codex-plugin/plugin.json").read_text(encoding="utf-8"))
          for prompt in manifest["interface"]["defaultPrompt"]:
              assert prompt.split(maxsplit=1)[0] in commands, prompt

      - run: python -X utf8 scripts/to_md.py --selftest

      - run: python -X utf8 scripts/fetch_plaud.py --selftest

      - run: python -X utf8 -m py_compile scripts/to_md.py scripts/fetch_plaud.py
